# SPORE backend stack (compose spec, host-agnostic).
# Copy .env.example to .env and fill it in before running `docker compose up`.

services:
  # Postgres, internal only (no published ports). Services reach it at host `postgres`.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chain event indexer: backfills from DEPLOY_BLOCK, polls every INDEXER_POLL_MS.
  indexer:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: indexer
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # HTTP API, the only service that publishes a port.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # Computes scores every SCORE_INTERVAL_MS using SCORE_MODEL_VERSION.
  score-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: score-engine
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # Publishes scores on-chain every ORACLE_PUBLISH_INTERVAL_MS.
  # Requires ORACLE_PRIVATE_KEY, supplied via the host's secret store or environment.
  oracle-publisher:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: oracle-publisher
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # DEV ONLY: never used by the production services
  # (they point at Robinhood Chain via RPC_URL).
  # Start with: docker compose --profile chain up anvil
  anvil:
    image: ghcr.io/foundry-rs/foundry:nightly
    profiles: ["chain"]
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 31337
    ports:
      - "8545:8545"
    restart: "no"

volumes:
  # Persistent Postgres data
  pgdata:
